[pytest]
; Only collect tests from tests/, never the ad-hoc scratch_*/check_*/seed_*
; scripts scattered across the backend root (and the repo root above it).
testpaths = tests
; koda-frontend/backend is imported as the "backend" package (see backend/main.py's
; "from backend.xxx import ..." style imports), so the parent directory
; (koda-frontend) must be on sys.path for that import style to resolve.
pythonpath = ..
; test_logistica_e2e.py is a real pytest-style test but calls a live server on
; http://localhost:8000 via `requests` — it needs the app actually running and
; is out of scope for this CI pass (no live-server step here yet). Excluded so
; automated runs don't fail on missing infrastructure; run it manually with the
; dev server up.
; --ignore-glob (not --ignore) so this still excludes the file no matter
; whether pytest is invoked from repo root or from this directory.
addopts = --ignore-glob=**/test_logistica_e2e.py
